<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    The product was renamed SimplImex -> SimplImpex. This path was public and is
    linked from the sitemap and from four blog posts, so it stays as a redirect.
    GitHub Pages cannot issue a real 301, hence the canonical + refresh + script.
    Deliberately not listed in partials/chrome.config.json: it carries no nav,
    no footer and no sitemap entry, so nothing here needs regenerating.
  -->
  <title>Moved to SimplImpex AI — Xentovia Tech</title>
  <link rel="canonical" href="https://xentovia.ai/simplimpex/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/simplimpex/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>location.replace('/simplimpex/' + location.hash);</script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #03050a;
      color: #94a3b8;
      font-family: 'Inter', system-ui, sans-serif;
      text-align: center;
    }
    a { color: #818cf8; }
  </style>
</head>
<body>
  <p>SimplImex is now <a href="/simplimpex/">SimplImpex AI</a>. Redirecting&hellip;</p>
</body>
</html>
