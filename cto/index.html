<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13296B" />
  <title>CTO — Xentovia</title>
  <meta name="description" content="Office of the CTO, Xentovia. Email cto@xentovia.ai." />
  <meta name="robots" content="noindex" />

  <!-- Open Graph -->
  <meta property="og:title" content="CTO — Xentovia" />
  <meta property="og:description" content="CTO & Co-Founder, Xentovia." />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://xentovia.ai/cto/" />
  <link rel="canonical" href="https://xentovia.ai/cto/" />
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- PWA: install as app on mobile -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="CTO · Xentovia" />

  <!-- iOS Safari: Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CTO · Xentovia" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Instrument Serif"', 'ui-serif', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            space: { 950: '#13296B', 900: '#13296B', 800: '#0E2059', 700: '#0E2059' },
            accent: { 400: '#C9A6D6', 500: '#6B2178', 600: '#571A62' },
          },
        },
      },
    };
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- QR code generator (~12KB) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--xv-navy);
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden; /* non-scrolling card */
    }

    body {
      min-height: 100svh; /* small viewport units — best for mobile chrome */
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 3.5vw, 32px);
      position: relative;
      isolation: isolate;
    }

    /* ── Ambient backdrop ──────────────────────────────────────── */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: var(--xv-navy);
    }

    /* faint grid texture for "deep tech" */
    .grid-texture {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: none;
      background-size: 48px 48px;
    }

    /* drifting orbs (kept subtle for a calm card) */
    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(6vw, -4vh); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-5vw, 5vh); }
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: -1;
      will-change: transform;
    }
    .orb-a {
      width: 420px; height: 420px; top: -120px; left: -80px;
      background: none;
      animation: drift1 16s ease-in-out infinite;
    }
    .orb-b {
      width: 360px; height: 360px; bottom: -120px; right: -80px;
      background: none;
      animation: drift2 20s ease-in-out infinite;
    }

    /* ── Card ──────────────────────────────────────────────────── */
    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      padding: 30px 28px 26px;
      border-radius: 28px;
      background: var(--xv-navy-deep);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow:
        0 30px 80px -20px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.02) inset,
        0 1px 0 rgba(255,255,255,0.08) inset;
      animation: cardIn 900ms cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(14px) scale(.985); }
      100% { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* hairline accent at top */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 14%; right: 14%;
      height: 1px;
      background: var(--xv-lilac);
      pointer-events: none;
    }

    /* corner ticks for the "executive engraving" feel */
    .tick {
      position: absolute;
      width: 14px; height: 14px;
      border-color: rgba(var(--xv-lilac-rgb),0.35);
      pointer-events: none;
    }
    .tick-tl { top: 12px;    left: 12px;    border-top: 1px solid; border-left: 1px solid;  border-top-left-radius: 6px; }
    .tick-tr { top: 12px;    right: 12px;   border-top: 1px solid; border-right: 1px solid; border-top-right-radius: 6px; }
    .tick-bl { bottom: 12px; left: 12px;    border-bottom: 1px solid; border-left: 1px solid;  border-bottom-left-radius: 6px; }
    .tick-br { bottom: 12px; right: 12px;   border-bottom: 1px solid; border-right: 1px solid; border-bottom-right-radius: 6px; }

    /* ── Wordmark ─────────────────────────────────────────────── */
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(226,232,240,0.85);
    }
    .wordmark .logo-lockup { display: block; height: 40px; width: auto; margin: -8px 0 -8px -10px; }
    .wordmark .logo {
      width: 22px; height: 22px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 4px 12px -4px rgba(0,0,0,0.4);
    }
    .wordmark .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 0 3px rgba(110,231,183,0.18);
      animation: pulseDot 2.4s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { box-shadow: 0 0 0 3px rgba(110,231,183,0.18); }
      50%      { box-shadow: 0 0 0 5px rgba(110,231,183,0.10); }
    }

    /* ── Avatar ───────────────────────────────────────────────── */
    .avatar-wrap {
      position: relative;
      width: 144px; height: 144px;
      margin: 20px auto 16px;
    }
    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: none;
      filter: blur(14px);
      opacity: 0.55;
      z-index: 0;
      animation: spin 18s linear infinite;
    }
    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      padding: 2px;
      background: none; border: 2px solid var(--xv-lilac);
      z-index: 1;
      animation: spin 24s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar {
      position: relative;
      z-index: 2;
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 28%;
      background: var(--xv-navy-deep);
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6);
    }

    
    .avatar-clip {
      position: relative;
      z-index: 2;
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--xv-navy-deep);
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6);
    }
    .avatar-clip .avatar {
      border-radius: 0;
      box-shadow: none;
      transform: scale(1.25) translate(0, 6%);
    }

    /* ── Identity ─────────────────────────────────────────────── */
    .name {
      font-family: var(--xv-font-heading);
      font-size: clamp(38px, 9vw, 46px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--xv-lilac-soft);
      text-align: center;
    }
    .name .ampersign {
      font-style: italic;
      color: var(--xv-lilac);
    }
    .title {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(var(--xv-lilac-soft-rgb),0.85);
      text-align: center;
    }
    .title .sep {
      display: inline-block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(var(--xv-lilac-soft-rgb),0.45);
      vertical-align: middle;
      margin: 0 8px 2px;
    }
    .company-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 13px;
      color: rgba(226,232,240,0.7);
      transition: color 200ms ease;
    }
    .company-link:hover { color: var(--xv-lilac-soft); }
    .company-link svg { transition: transform 200ms ease; }
    .company-link:hover svg { transform: translate(2px, -2px); }

    /* ── Hairline divider ─────────────────────────────────────── */
    .divider {
      margin: 22px 0 18px;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* ── Action icons row ─────────────────────────────────────── */
    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .action {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      border-radius: 14px;
      color: #e2e8f0;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .action:hover, .action:focus-visible {
      background: rgba(var(--xv-lilac-rgb),0.10);
      border-color: rgba(var(--xv-lilac-rgb),0.35);
      color: var(--xv-lilac-soft);
      transform: translateY(-1px);
      outline: none;
    }
    .action:active { transform: translateY(0); }
    .action svg { width: 20px; height: 20px; }
    .action .label {
      position: absolute;
      bottom: -18px; left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(148,163,184,0.85);
    }

    /* ── Save Contact CTA ─────────────────────────────────────── */
    .cta {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 54px;
      margin-top: 22px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
      background:
        var(--xv-purple);
      box-shadow:
        0 10px 30px -8px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.1) inset;
      transition: transform 180ms ease, box-shadow 220ms ease, filter 220ms ease;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: none;
      transform: translateX(-100%);
      transition: transform 700ms ease;
    }
    .cta:hover::before { transform: translateX(100%); }
    .cta:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow:
        0 16px 40px -8px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.15) inset;
    }
    .cta:active { transform: translateY(0); }
    .cta svg { width: 18px; height: 18px; }

    .cta.saved {
      background: #10b981;
    }

    /* ── Footer micro ─────────────────────────────────────────── */
    .meta {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(148,163,184,0.85);
    }
    .meta a { color: inherit; transition: color 200ms ease; }
    .meta a:hover { color: var(--xv-lilac-soft); }

    /* ── QR modal ─────────────────────────────────────────────── */
    .qr-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(var(--xv-navy-rgb),0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .qr-modal.open { display: flex; animation: qrFadeIn 220ms ease-out; }
    @keyframes qrFadeIn { from { opacity: 0; } to { opacity: 1; } }

    .qr-panel {
      position: relative;
      width: 100%;
      max-width: 360px;
      padding: 28px 28px 22px;
      border-radius: 24px;
      background: #f8fafc;
      color: #0f172a;
      box-shadow: 0 30px 80px -10px rgba(0,0,0,0.7);
      animation: qrPanelIn 280ms cubic-bezier(.2,.7,.2,1);
    }
    @keyframes qrPanelIn {
      from { opacity: 0; transform: translateY(10px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .qr-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      background: rgba(15,23,42,0.06);
      color: #0f172a;
      transition: background 160ms ease;
      cursor: pointer;
    }
    .qr-close:hover { background: rgba(15,23,42,0.12); }
    .qr-close svg { width: 18px; height: 18px; }

    .qr-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    .qr-head img { width: 26px; height: 26px; border-radius: 7px; }
    .qr-head .who { line-height: 1.15; }
    .qr-head .who strong { font-family: var(--xv-font-heading); font-weight: 700; font-size: 19px; color: #0f172a; display: block; }
    .qr-head .who span { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #475569; }

    .qr-canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 14px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 0 0 1px rgba(15,23,42,0.06) inset;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-canvas svg { width: 100%; height: 100%; display: block; }

    .qr-cta {
      margin-top: 14px;
      text-align: center;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      color: #475569;
    }
    .qr-cta strong { color: #0f172a; font-weight: 600; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Very short viewports — keep within fold */
    @media (max-height: 700px) {
      .card { padding: 22px 24px 22px; max-width: 400px; }
      .avatar-wrap { width: 116px; height: 116px; margin: 12px auto 10px; }
      .name { font-size: clamp(32px, 8vw, 38px); }
      .divider { margin: 14px 0 12px; }
      .actions { gap: 8px; }
      .action { height: 48px; }
      .cta { margin-top: 14px; height: 50px; }
      .meta { margin-top: 12px; }
    }
  </style>
  <link rel="stylesheet" href="/assets/brand/brand.css">
  <script src="/assets/brand/tailwind-brand.js"></script>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-texture"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="card" role="main" aria-labelledby="card-name">
    <span class="tick tick-tl"></span>
    <span class="tick tick-tr"></span>
    <span class="tick tick-bl"></span>
    <span class="tick tick-br"></span>

    <header style="display:flex;align-items:center;justify-content:space-between;">
      <a class="wordmark" href="https://xentovia.ai" target="_blank" rel="noopener" style="text-decoration:none;">
        <img class="logo-lockup" src="/assets/brand/logo/xentovia-horizontal-dark.svg" alt="Xentovia — Agentic AI for Enterprise" width="123" height="40" />
      </a>
      <span class="wordmark" style="color:rgba(148,163,184,0.85); font-size:9.5px;">
        Digital Card
      </span>
    </header>



    <h1 id="card-name" class="name" style="margin-top:28px">Xentovia</h1>

    <div class="title">
      Office of the CTO
    </div>

    <div style="text-align:center;">
      <a class="company-link" href="https://xentovia.ai" target="_blank" rel="noopener">
        xentovia.ai
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="12" height="12" aria-hidden="true">
          <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
        </svg>
      </a>
    </div>

    <div class="divider" role="separator" aria-hidden="true"></div>


    <p class="more" style="text-align:center;margin-top:18px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.78)">
      For more details, email<br>
      <a href="mailto:cto@xentovia.ai" style="color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px">cto@xentovia.ai</a>
    </p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: '/cto/' }).catch(() => { /* no-op */ });
      });
    }
  </script>
</body>
</html>
