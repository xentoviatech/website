<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ID verification — Xentovia</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/verify/verify.css" />
</head>
<body data-state="wait">
  <main class="card">
    <header><a href="https://xentovia.ai" class="brand"><img src="/favicon.png" alt="" width="22" height="22">Xentovia</a><span class="tag">ID verification</span></header>
    <h1>Verify an ID card</h1>
    <form class="detail" onsubmit="var v=this.q.value.trim().toUpperCase().replace(/^XT-?/,'');location.href='/verify/XT-'+v.padStart(4,'0')+'/';return false">
      Enter the ID number printed on the card<br><br>
      <input name="q" placeholder="XT-0011" autocomplete="off" style="padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:15px;width:60%">
      <button style="padding:10px 16px;border-radius:12px;border:0;background:#6366f1;color:#fff;font-weight:600;font-size:15px">Check</button>
    </form>
    <footer>Questions: <a href="mailto:hello@xentovia.ai">hello@xentovia.ai</a><br>Xentovia Tech Private Limited · Bengaluru</footer>
  </main>
</body>
</html>
